<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b18"><link rel="manifest" href="manifest.webmanifest"><title>LearnScroll AI</title><style>
